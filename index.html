
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>ENCS4380 Dynamics Toolkit</title>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body>
  <h1>Dynamic Characteristics Toolkit</h1>
  <h2>Module 1: First-Order Response</h2>

  <!-- Time Constant Slider -->
  <label>
    Time Constant (τ):
    <span id="tauValue">2</span> s
  </label>
  <input type="range" id="tau"
         min="0.5" max="10" step="0.5" value="2">

  <!-- Gain Slider -->
  <br><br>
  <label>
    Gain (K):
    <span id="kValue">1</span>
  </label>
  <input type="range" id="gain"
         min="0.5" max="5" step="0.5" value="1">

  <!-- Input Type -->
  <br><br>
  <label for="inputType">Input Type:</label>
  <select id="inputType">
    <option value="step">Step</option>
    <option value="ramp">Ramp</option>
  </select>

  <!-- Response Plot -->
  <div id="plot"></div>

  <script>
    const tauSlider = document.getElementById("tau");
    const gainSlider = document.getElementById("gain");
    const inputType = document.getElementById("inputType");

    function updatePlot() {
      const tau = Number(tauSlider.value);
      const K = Number(gainSlider.value);
      const type = inputType.value;

      document.getElementById("tauValue").textContent = tau;
      document.getElementById("kValue").textContent = K;

      const t = [];
      const y = [];
      const ideal = [];

      for (let i = 0; i <= 200; i++) {
        const time = i * 5 * tau / 200;
        t.push(time);

        if (type === "step") {
          // Unit step input: A = 1
          y.push(K * (1 - Math.exp(-time / tau)));
          ideal.push(K);
        } else {
          // Unit ramp input: x(t) = t
          y.push(K * (
            time - tau * (1 - Math.exp(-time / tau))
          ));
          ideal.push(K * time);
        }
      }

      const traces = [
        {
          x: t,
          y: y,
          type: "scatter",
          mode: "lines",
          name: "Sensor Output"
        }
      ];

      if (type === "step") {
        traces.push({
          x: [tau, 3 * tau],
          y: [
            K * (1 - Math.exp(-1)),
            K * (1 - Math.exp(-3))
          ],
          type: "scatter",
          mode: "markers+text",
          text: ["63.2%", "95%"],
          textposition: "top center",
          name: "Validation Points"
        });
      } else {
        traces.push({
          x: t,
          y: ideal,
          type: "scatter",
          mode: "lines",
          line: {dash: "dash"},
          name: "Ideal Output (K × Input)"
        });
      }

      Plotly.react("plot", traces, {
        title: type === "step"
          ? "First-Order Step Response"
          : "First-Order Ramp Response",
        xaxis: {title: "Time (s)"},
        yaxis: {title: "Sensor Output"},
        margin: {t: 60},
        legend: {orientation: "h", y: -0.25}
      }, {responsive: true});
    }

    tauSlider.addEventListener("input", updatePlot);
    gainSlider.addEventListener("input", updatePlot);
    inputType.addEventListener("change", updatePlot);

    updatePlot();
  </script>
</body>
</html>
