
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>ENCS4380 Dynamics Toolkit</title>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
</head>
<body>
  <h1>Dynamic Characteristics Toolkit</h1>
  <h2>Module 1: First-Order Response</h2>

  <label>
    Time Constant (τ):
    <span id="tauValue">2</span> s
  </label>

  <input type="range" id="tau"
         min="0.5" max="10" step="0.5" value="2">

  <div id="plot"></div>

  <script>
    const slider = document.getElementById("tau");

    function updatePlot() {
      const tau = Number(slider.value);
      document.getElementById("tauValue").textContent = tau;

      const t = [];
      const y = [];

      for (let i = 0; i <= 200; i++) {
        const time = i * 5 * tau / 200;
        t.push(time);
        y.push(1 - Math.exp(-time / tau));
      }

      Plotly.react("plot", [
        {
          x: t,
          y: y,
          type: "scatter",
          mode: "lines",
          name: "Step Response"
        },
        {
          x: [tau, 3 * tau],
          y: [1 - Math.exp(-1), 1 - Math.exp(-3)],
          type: "scatter",
          mode: "markers+text",
          text: ["63.2%", "95%"],
          textposition: "top center",
          name: "Validation Points"
        }
      ], {
        title: "First-Order Step Response",
        xaxis: {title: "Time (s)"},
        yaxis: {title: "Sensor Output", range: [0, 1.1]}
      }, {responsive: true});
    }

    slider.addEventListener("input", updatePlot);
    updatePlot();
  </script>
</body>
</html>
